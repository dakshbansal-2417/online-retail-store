# Apache configuration for the ORS web pages.
# Installed by scripts/install_web.sh as /etc/apache2/conf-available/ors.conf
#
#   http://localhost/ors/                    landing page (static HTML)
#   http://localhost/ors-cgi/catalog.cgi     public product catalogue (C CGI)
#   http://localhost/ors-cgi/reports.cgi     admin reports (C CGI, password protected)

Alias /ors /var/www/ors
<Directory "/var/www/ors">
    Options -Indexes
    Require all granted
</Directory>

ScriptAlias /ors-cgi/ /usr/lib/cgi-bin/ors/
<Directory "/usr/lib/cgi-bin/ors">
    Options +ExecCGI -Indexes
    AllowOverride None
    Require all granted
    SetEnv ORS_WEB_CONFIG /etc/ors/web.conf
</Directory>

# Reports are for the store administrator only
<Location "/ors-cgi/reports.cgi">
    AuthType Basic
    AuthName "ORS admin reports"
    AuthUserFile /etc/ors/htpasswd
    Require valid-user
</Location>
